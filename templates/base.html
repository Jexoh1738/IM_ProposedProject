{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wellspace helps students make space for their wellbeing.">
  <title>{% block title %}Wellspace{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block page_styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if messages %}
    <div class="flash-messages" aria-live="polite">
      {% for message in messages %}<div class="flash-message {{ message.tags }}">{{ message }}</div>{% endfor %}
    </div>
  {% endif %}
  {% block content %}{% endblock %}
  <script src="{% static 'js/app.js' %}"></script>
  {% block page_scripts %}{% endblock %}
</body>
</html>
